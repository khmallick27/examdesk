<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ExamDesk – RMGEC Online Examination</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="brand">
  <img src="/logo.png" alt="College logo">
  <div class="grow">
    <div class="t1">Ramkrishna Mahato Government Engineering College, Purulia</div>
    <div class="t2" id="hdrDept">Online Examination Portal</div>
  </div>
  <div class="right" id="hdrRight"></div>
</header>
<div class="subbar" id="subbar"></div>

<main id="app"><div class="wrap"><div class="card">Loading examination…</div></div></main>

<div id="zoom" class="zoom hidden" role="dialog" aria-modal="true" aria-label="Diagram zoom">
  <div class="zoom-bar"><button type="button" class="btn small" data-z="-">−</button><span id="zoomPct">100%</span><button type="button" class="btn small" data-z="+">+</button>
    <button type="button" class="btn small" data-z="fit">Fit</button><span class="spacer"></span><button type="button" class="btn small" data-z="x" aria-label="Close zoom">✕ Close</button></div>
  <div class="zoom-area" id="zoomArea"><img id="zoomImg" alt="Enlarged diagram"></div>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="box" id="modalBox"></div></div>

<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/contrib/auto-render.min.js"></script>
<script src="/calc.js"></script>
<script src="/exam.js"></script>
</body>
</html>
